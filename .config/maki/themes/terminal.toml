"comment"                         = { fg = "cyan" }
"comment.block"                   = { fg = "cyan" }
"comment.block.documentation"     = { fg = "cyan" }
"comment.line"                    = { fg = "cyan" }
"comment.line.documentation"      = { fg = "cyan" }

"constant"                        = { fg = "magenta" }
"constant.builtin"                = { fg = "magenta" }
"constant.builtin.boolean"        = { fg = "magenta" }
"constant.character"              = { fg = "green" }
"constant.character.escape"       = { fg = "light-magenta" }
"constant.macro"                  = { fg = "magenta" }
"constant.numeric"                = { fg = "magenta" }
"constructor"                     = { fg = "cyan" }

"error"                           = { fg = "red" }
"warning"                         = { fg = "yellow" }
"info"                            = { fg = "light-gray" }
"hint"                            = { fg = "green" }

"diff.delta"                      = { fg = "yellow" }
"diff.minus"                      = { fg = "red" }
"diff.plus"                       = { fg = "green" }

"function"                        = { fg = "cyan" }
"function.builtin"                = { fg = "blue" }
"function.call"                   = { fg = "green" }
"function.macro"                  = { fg = "light-magenta" }
"function.method"                 = { fg = "blue" }

"keyword"                         = { fg = "blue" }
"keyword.control.conditional"     = { fg = "blue" }
"keyword.control.exception"       = { fg = "red" }
"keyword.control.import"          = { fg = "blue" }
"keyword.control.repeat"          = { fg = "blue" }
"keyword.directive"               = { fg = "magenta" }
"keyword.function"                = { fg = "blue" }
"keyword.operator"                = { fg = "blue" }
"keyword.return"                  = { fg = "blue" }
"keyword.storage"                 = { fg = "blue" }
"keyword.storage.modifier"        = { fg = "blue" }
"keyword.storage.type"            = { fg = "blue", modifiers = ["italic"] }

"label"                           = { fg = "cyan" }
"attribute"                       = { fg = "magenta", modifiers = ["italic"] }
"namespace"                       = { fg = "foreground" }
"annotation"                      = { fg = "magenta", modifiers = ["italic"] }

"markup.bold"                     = { fg = "blue", modifiers = ["bold"] }
"markup.heading"                  = { fg = "cyan", modifiers = ["bold"] }
"markup.italic"                   = { modifiers = ["italic"] }
"markup.link.text"                = { fg = "cyan" }
"markup.link.url"                 = { fg = "blue" }
"markup.list"                     = { fg = "magenta" }
"markup.quote"                    = { fg = "green", modifiers = ["italic"] }
"markup.raw"                      = { fg = "foreground" }
"markup.strikethrough"            = { modifiers = ["crossed_out"] }

"punctuation"                     = { fg = "foreground" }
"punctuation.bracket"             = { fg = "foreground" }
"punctuation.delimiter"           = { fg = "foreground" }
"punctuation.special"             = { fg = "light-magenta" }

"special"                         = { fg = "light-magenta" }

"string"                          = { fg = "green" }
"string.regexp"                   = { fg = "red" }
"string.special"                  = { fg = "yellow" }
"string.symbol"                   = { fg = "green" }

"tag"                             = { fg = "light-magenta" }
"tag.attribute"                   = { fg = "light-blue" }
"tag.delimiter"                   = { fg = "foreground" }

"type"                            = { fg = "yellow", modifiers = ["italic"] }
"type.builtin"                    = { fg = "yellow" }
"type.enum.variant"               = { fg = "yellow", modifiers = ["italic"] }

"variable"                        = { fg = "foreground" }
"variable.builtin"                = { fg = "light-magenta", modifiers = ["italic"] }
"variable.other"                  = { fg = "foreground" }
"variable.other.member"           = { fg = "foreground" }
"variable.parameter"              = { fg = "light-blue", modifiers = ["italic"] }

[palette]
background = "default"
foreground = "default"
comment    = "cyan"
mode_build = "red"
mode_plan  = "green"
mode_bash  = "default"

[ui]
user               = { fg = "default" }
assistant          = { fg = "default" }
assistant_prefix   = { fg = "default", modifiers = ["bold"] }
thinking           = { fg = "default", modifiers = ["italic"] }

tool               = { fg = "default" }
tool_prefix        = { fg = "default", modifiers = ["bold"] }
tool_path          = { fg = "default" }
tool_annotation    = { fg = "default" }
tool_success       = { fg = "default" }
tool_error         = { fg = "default" }
tool_dim           = { fg = "default" }

error              = { fg = "default" }
status_dim         = { fg = "default" }

strikethrough      = { fg = "default", modifiers = ["crossed_out"] }
horizontal_rule    = { fg = "default" }
plan_rule          = { fg = "default", modifiers = ["bold"] }
code_gutter        = { fg = "default" }
table_border       = { fg = "default" }

diff_old           = { fg = "red" }
diff_new           = { fg = "green" }
diff_old_sign      = { fg = "red", modifiers = ["bold"] }
diff_new_sign      = { fg = "green", modifiers = ["bold"] }
diff_old_emphasis  = { modifiers = ["reversed"] }
diff_new_emphasis  = { modifiers = ["reversed"] }
diff_line_nr       = { fg = "default" }

todo_completed     = { fg = "default" }
todo_in_progress   = { fg = "default" }
todo_pending       = { fg = "default" }
todo_cancelled     = { fg = "default", modifiers = ["crossed_out"] }

item_selected      = { fg = "default", bg = "default", modifiers = ["reversed"] }
item               = { fg = "default" }
item_desc          = { fg = "default" }
accent             = { fg = "default" }
panel_border       = { fg = "default" }
panel_title        = { fg = "default", modifiers = ["bold"] }
cursor             = { fg = "default", bg = "default", modifiers = ["reversed"] }
keybind_key        = { fg = "default", modifiers = ["bold"] }
keybind_section    = { fg = "default", modifiers = ["bold"] }
input_border       = { fg = "default" }
keybind_desc       = { fg = "default" }
queue              = { fg = "default" }
plan_path          = { fg = "default", modifiers = ["bold"] }
status_notice      = { fg = "default" }
status_retry_error = { fg = "default" }
status_retry_info  = { fg = "default" }
input_placeholder  = { fg = "default" }
queue_delete       = { fg = "default", modifiers = ["bold"] }
timestamp          = { fg = "default" }
spinner            = { fg = "default" }
active             = { fg = "default" }
