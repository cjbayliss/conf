add_newline = false
format = "$hostname$directory$git_branch$git_commit$git_state$git_status$env_var$status$cmd_duration$character"

[character]
format = "» "

[directory]
fish_style_pwd_dir_length = 1
format = "[$path]($style) "
style = "bright-cyan"
truncate_to_repo = false
truncation_length = 1

[git_branch]
format = "[$branch]($style) "
style = "bright-purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "purple"
conflicted = "!!"
deleted = "D"
modified = "M"
renamed = "R"
staged = "M"

[hostname]
format = "$hostname "
ssh_only = false

[line_break]
disabled = true

[status]
disabled = false
format = "[$status]($style) "

[cmd_duration]
format = "[$duration](white) "
show_milliseconds = true
