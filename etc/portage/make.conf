COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sse sse2 sse3 sse4_1 sse4_2 ssse3"

# gentoo requires this if you report bugs
LC_MESSAGES="C.utf8"

MAKEOPTS="-j8 -l8"

ACCEPT_LICENSE="-* @FREE"

# VIDEO and DEVICES
INPUT_DEVICES="libinput wacom"
VIDEO_CARDS="intel"

# ENGLISH
L10N="en en_AU en_GB en-AU en-GB"

# use https mirrors
GENTOO_MIRRORS="
    https://ftp.swin.edu.au/gentoo
    https://mirror.aarnet.edu.au/pub/gentoo/
    https://mirror.rackspace.com/gentoo/
    https://distfiles.gentoo.org
"

FEATURES="suidctl"

USE="bluetooth dbus elogind icu opengl pipewire pulseaudio qt6 wayland vaapi vulkan -X -initramfs -ipv6 -perl -qt5 -suid -vala"
